<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R6 EXTRACTION - Triangulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', 'Arial Black', Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
      background-attachment: fixed;
      color: #e0e6ed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Scanlines effect background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 165, 0, 0.03) 0px,
        rgba(255, 165, 0, 0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1;
      animation: scanlines 8s linear infinite;
    }
    
    @keyframes scanlines {
      0% { transform: translateY(0); }
      100% { transform: translateY(10px); }
    }
    
    .card {
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
      border: 3px solid #ffa500;
      border-radius: 2px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 
        0 0 40px rgba(255, 165, 0, 0.4),
        0 0 80px rgba(255, 165, 0, 0.2),
        inset 0 0 20px rgba(255, 165, 0, 0.1);
      text-align: center;
      border-image: linear-gradient(135deg, #ffa500, #ffdd00, #ffa500) 1;
      animation: cardPulse 3s ease-in-out infinite;
    }
    
    @keyframes cardPulse {
      0%, 100% { box-shadow: 0 0 40px rgba(255, 165, 0, 0.4), 0 0 80px rgba(255, 165, 0, 0.2), inset 0 0 20px rgba(255, 165, 0, 0.1); }
      50% { box-shadow: 0 0 60px rgba(255, 165, 0, 0.6), 0 0 120px rgba(255, 165, 0, 0.3), inset 0 0 30px rgba(255, 165, 0, 0.15); }
    }
    
    h1 {
      color: #ffdd00;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 8px;
      text-transform: uppercase;
      user-select: none;
      text-shadow: 
        0 0 10px rgba(255, 221, 0, 0.8),
        0 0 20px rgba(255, 165, 0, 0.6),
        0 0 30px rgba(255, 165, 0, 0.4);
      animation: titleGlow 2s ease-in-out infinite;
    }
    
    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 10px rgba(255, 221, 0, 0.8), 0 0 20px rgba(255, 165, 0, 0.6), 0 0 30px rgba(255, 165, 0, 0.4); }
      50% { text-shadow: 0 0 20px rgba(255, 221, 0, 1), 0 0 40px rgba(255, 165, 0, 0.8), 0 0 60px rgba(255, 165, 0, 0.6); }
    }
    
    .subtitle {
      font-size: 0.95rem;
      color: #ffa500;
      margin-bottom: 24px;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255, 165, 0, 0.6);
      font-weight: bold;
    }
    
    .status-container {
      display: flex;
      justify-content: space-around;
      margin-bottom: 32px;
      gap: 10px;
    }
    
    .status-box {
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.9), rgba(13, 17, 23, 0.9));
      border: 2px solid #554400;
      border-radius: 0px;
      padding: 16px 12px;
      width: 30%;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .status-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 221, 0, 0.4), transparent);
      transition: left 0.5s ease;
    }
    
    .status-box:hover::before {
      left: 100%;
    }
    
    .status-box.active {
      border-color: #ffdd00;
      background: linear-gradient(135deg, rgba(255, 221, 0, 0.15), rgba(255, 165, 0, 0.1));
      box-shadow: 
        0 0 20px rgba(255, 221, 0, 0.6),
        inset 0 0 15px rgba(255, 221, 0, 0.2);
    }
    
    .ready-indicator {
      font-size: 0.7rem;
      color: #888888;
      margin-top: 6px;
      letter-spacing: 0.5px;
      font-weight: bold;
      min-height: 14px;
    }
    
    .ready-indicator.ready {
      color: #00ff00;
      text-shadow: 0 0 8px rgba(0, 255, 0, 0.8);
    }
    
    .status-title {
      font-size: 0.75rem;
      color: #ffa500;
      font-weight: bold;
      letter-spacing: 1px;
    }
    
    .status-value {
      font-size: 1.3rem;
      font-weight: 900;
      margin-top: 8px;
      letter-spacing: 2px;
    }
    
    .status-value.off { 
      color: #cc3333;
      text-shadow: 0 0 8px rgba(204, 51, 51, 0.8);
    }
    
    .status-value.on { 
      color: #ffdd00;
      text-shadow: 0 0 12px rgba(255, 221, 0, 0.9);
      animation: statusPulse 0.6s ease-in-out;
    }
    
    @keyframes statusPulse {
      0%, 100% { text-shadow: 0 0 12px rgba(255, 221, 0, 0.9); }
      50% { text-shadow: 0 0 25px rgba(255, 165, 0, 1), 0 0 40px rgba(255, 221, 0, 0.8); }
    }

    .btn-activate {
      background: linear-gradient(135deg, #ffdd00, #ffa500, #ff8800);
      color: #000000;
      border: 2px solid #ffaa00;
      padding: 18px 36px;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      border-radius: 0px;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 
        0 0 20px rgba(255, 165, 0, 0.6),
        inset 0 0 10px rgba(255, 221, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .btn-activate::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }
    
    .btn-activate:hover::before {
      left: 100%;
    }
    
    .btn-activate:hover {
      box-shadow: 
        0 0 40px rgba(255, 165, 0, 0.9),
        inset 0 0 15px rgba(255, 221, 0, 0.5);
      transform: translateY(-2px);
    }
    
    .btn-activate:active {
      transform: scale(0.98);
      box-shadow: 
        0 0 60px rgba(255, 165, 0, 1),
        inset 0 0 20px rgba(255, 221, 0, 0.6);
    }
    
    .btn-activate:disabled {
      background: #333333;
      color: #666666;
      border-color: #555555;
      cursor: not-allowed;
      box-shadow: none;
      text-shadow: none;
    }

    .btn-ready {
      display: none;
      margin-top: 12px;
      background: linear-gradient(135deg, #555555, #777777, #555555);
      color: #ffffff;
      border: 2px solid #888888;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 0px;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(136, 136, 136, 0.4);
    }
    
    .btn-ready:hover {
      box-shadow: 0 0 20px rgba(136, 136, 136, 0.6);
      transform: translateY(-2px);
    }
    
    .btn-ready.active {
      background: linear-gradient(135deg, #00dd00, #00ff00, #00dd00);
      color: #000000;
      border-color: #00ff00;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.8), inset 0 0 10px rgba(0, 255, 0, 0.3);
      font-weight: 900;
    }
    
    .btn-ready.active:hover {
      box-shadow: 0 0 50px rgba(0, 255, 0, 1), inset 0 0 15px rgba(0, 255, 0, 0.5);
    }
    
    .btn-ready:active {
      transform: scale(0.98);
    }

    .btn-reset {
      display: none;
      margin-top: 16px;
      background: linear-gradient(135deg, #cc3333, #ff4444, #dd2222);
      color: #ffffff;
      border: 2px solid #ff6666;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 0px;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(204, 51, 51, 0.6);
    }
    
    .btn-reset:hover {
      box-shadow: 0 0 30px rgba(255, 68, 68, 0.9);
      transform: translateY(-2px);
    }
    
    .btn-reset:active {
      transform: scale(0.98);
    }

    .clue-box {
      display: none;
      margin-top: 24px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(255, 221, 0, 0.1), rgba(255, 165, 0, 0.05));
      border: 2px solid #ffdd00;
      border-radius: 0px;
      color: #ffdd00;
      animation: clueAppear 0.8s ease-in-out;
      box-shadow: 
        0 0 30px rgba(255, 221, 0, 0.5),
        inset 0 0 15px rgba(255, 221, 0, 0.1);
      text-shadow: 0 0 10px rgba(255, 221, 0, 0.6);
    }
    
    .clue-box h3 {
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 900;
    }
    
    @keyframes clueAppear {
      from { 
        opacity: 0; 
        transform: translateY(20px);
        box-shadow: 0 0 0px rgba(255, 221, 0, 0);
      }
      to { 
        opacity: 1; 
        transform: translateY(0);
        box-shadow: 0 0 30px rgba(255, 221, 0, 0.5), inset 0 0 15px rgba(255, 221, 0, 0.1);
      }
    }
  </style>

  <!-- SDK Firebase V9 (Modules compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="card">
    <h1>MISSION TRIANGULATION</h1>
    <div class="subtitle" id="station-label">CHARGEMENT...</div>

    <div class="status-container">
      <div class="status-box" id="box-A">
        <div class="status-title">RELAIS A</div>
        <div class="status-value off" id="val-A">OFF</div>
        <div class="ready-indicator" id="ready-A"></div>
      </div>
      <div class="status-box" id="box-B">
        <div class="status-title">RELAIS B</div>
        <div class="status-value off" id="val-B">OFF</div>
        <div class="ready-indicator" id="ready-B"></div>
      </div>
      <div class="status-box" id="box-C">
        <div class="status-title">RELAIS C</div>
        <div class="status-value off" id="val-C">OFF</div>
        <div class="ready-indicator" id="ready-C"></div>
      </div>
    </div>

    <!-- Bouton Joueur -->
    <button class="btn-activate" id="activate-btn" onclick="activateStation()">ACTIVER LE RELAIS</button>

    <!-- Bouton Prêt -->
    <button class="btn-ready" id="ready-btn" onclick="toggleReady()">🔄 PRÊT</button>

    <!-- Bouton Administrateur -->
    <button class="btn-reset" id="reset-btn" onclick="resetGame()">⚠️ RÉINITIALISER LA MISSION</button>

    <!-- Zone d'affichage de l'indice final -->
    <div class="clue-box" id="clue-box">
      <h3>SIGNAL TRIANGULÉ !</h3>
      <p id="clue-text" style="margin-top: 8px; font-weight: bold; color: #fff;">
        L'indice final s'affiche ici : "Rendez-vous au grand chêne près de la cabane !"
      </p>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. CONFIGURATION FIREBASE
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBxehS0c1P5agFoWPphgF1WUmNV3n8rdnI",
      authDomain: "r6-triangulation.firebaseapp.com",
      databaseURL: "https://r6-triangulation-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "r6-triangulation",
      storageBucket: "r6-triangulation.firebasestorage.app",
      messagingSenderId: "211530235938",
      appId: "1:211530235938:web:d0fb255fd94c3764ad4a7b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const MAX_TIME_WINDOW_MS = 30 * 1000;

    // Codes sécurisés des stations (6 caractères alphanumériques)
    const STATION_CODES = {
      'k9xrt2': 'A',
      'm7pqv5': 'B',
      'n3sfw8': 'C'
    };

    const ADMIN_CODE = 'admin_panel_secure';

    // Fonction pour générer des codes si besoin
    function generateStationCode() {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    // -------------------------------------------------------------
    // 2. PARSING DE L'URL ET GESTION DES MODES
    // -------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const stationParam = (urlParams.get('station') || '').toLowerCase();
    
    // Déterminer la station actuelle à partir du code
    let currentStation = null;
    let isAdmin = false;
    
    if (stationParam === ADMIN_CODE) {
      isAdmin = true;
      currentStation = 'admin';
    } else if (STATION_CODES[stationParam]) {
      currentStation = STATION_CODES[stationParam];
    } else if (stationParam === 'reset') {
      currentStation = 'reset';
    } else {
      // Aucun code valide
      currentStation = null;
    }

    const stationLabel = document.getElementById('station-label');
    const activateBtn = document.getElementById('activate-btn');
    const resetBtn = document.getElementById('reset-btn');
    const readyBtn = document.getElementById('ready-btn');

    // Fonction de réinitialisation sécurisée
    function executeReset(redirectAfter = false) {
      if (resetBtn) resetBtn.innerText = "PATIENTEZ...";

      db.ref('triangulation').set({
        station_A: { active: false, timestamp: 0, ready: false },
        station_B: { active: false, timestamp: 0, ready: false },
        station_C: { active: false, timestamp: 0, ready: false }
      })
      .then(() => {
        if (redirectAfter) {
          window.location.href = window.location.pathname + '?station=' + ADMIN_CODE;
        } else if (resetBtn) {
          resetBtn.innerText = "⚠️ RÉINITIALISER LA MISSION";
        }
      })
      .catch((error) => {
        alert("Erreur lors de la réinitialisation : " + error.message);
        if (resetBtn) resetBtn.innerText = "⚠️ RÉINITIALISER LA MISSION";
      });
    }

    // Initialisation selon le paramètre URL
    if (!currentStation) {
      // Code invalide ou manquant
      stationLabel.innerText = "CODE D'ACCÈS INVALIDE";
      stationLabel.style.color = "#cc3333";
      activateBtn.style.display = 'none';
      activateBtn.disabled = true;
      readyBtn.style.display = 'none';
    }
    else if (currentStation === 'reset') {
      stationLabel.innerText = "RÉINITIALISATION EN COURS...";
      stationLabel.style.color = "#cc3333";
      activateBtn.style.display = 'none';
      readyBtn.style.display = 'none';
      executeReset(true);
    } 
    else if (isAdmin) {
      stationLabel.innerText = "MODE ADMINISTRATEUR";
      stationLabel.style.color = "#cc3333";
      resetBtn.style.display = 'block';
      activateBtn.style.display = 'none';
      readyBtn.style.display = 'none';
    } 
    else {
      stationLabel.innerText = `STATION ACTIVE : RELAIS ${currentStation.toUpperCase()}`;
      readyBtn.style.display = 'block';
    }

    // -------------------------------------------------------------
    // 3. ACTIONS BOUTONS
    // -------------------------------------------------------------
    function activateStation() {
      if (!currentStation || currentStation === 'admin' || currentStation === 'reset') return;

      activateBtn.disabled = true;
      activateBtn.innerText = "RELAIS ÉMIS...";

      db.ref(`triangulation/station_${currentStation.toUpperCase()}`).set({
        active: true,
        timestamp: Date.now(),
        ready: false
      });
    }

    function toggleReady() {
      if (!currentStation || currentStation === 'admin' || currentStation === 'reset') return;

      const stationKey = `station_${currentStation.toUpperCase()}`;
      db.ref(`triangulation/${stationKey}`).once('value', (snapshot) => {
        const data = snapshot.val() || { active: false, timestamp: 0, ready: false };
        db.ref(`triangulation/${stationKey}`).update({
          ready: !data.ready
        });
      });
    }

    function resetGame() {
      executeReset(false);
    }

    // -------------------------------------------------------------
    // 4. SYNCHRONISATION TEMPS RÉEL (FIREBASE)
    // -------------------------------------------------------------
    db.ref('triangulation').on('value', (snapshot) => {
      const data = snapshot.val() || {};

      const stA = data.station_A || { active: false, timestamp: 0, ready: false };
      const stB = data.station_B || { active: false, timestamp: 0, ready: false };
      const stC = data.station_C || { active: false, timestamp: 0, ready: false };

    // Mise à jour des voyants de statut
      updateUI('A', stA.active);
      updateUI('B', stB.active);
      updateUI('C', stC.active);

      // Mise à jour des indicateurs de PRÊT pour toutes les stations
      updateReadyIndicator('A', stA.ready);
      updateReadyIndicator('B', stB.ready);
      updateReadyIndicator('C', stC.ready);

      // Gestion du bouton local
      if (currentStation && currentStation !== 'admin' && currentStation !== 'reset') {
        const myStationData = data[`station_${currentStation.toUpperCase()}`];

        if (!myStationData || !myStationData.active) {
          activateBtn.disabled = false;
          activateBtn.innerText = "ACTIVER LE RELAIS";
        } else {
          activateBtn.disabled = true;
          activateBtn.innerText = "RELAIS ÉMIS...";
        }

        // Mise à jour du bouton PRÊT
        if (myStationData && myStationData.ready) {
          readyBtn.classList.add('active');
          readyBtn.innerText = "✅ PRÊT";
        } else {
          readyBtn.classList.remove('active');
          readyBtn.innerText = "🔄 PRÊT";
        }
      }

      // Vérification des conditions de réussite
      if (stA.active && stB.active && stC.active) {
        const timestamps = [stA.timestamp, stB.timestamp, stC.timestamp];
        const minTime = Math.min(...timestamps);
        const maxTime = Math.max(...timestamps);

        if ((maxTime - minTime) <= MAX_TIME_WINDOW_MS) {
          document.getElementById('clue-box').style.display = 'block';
        } else {
          alert("ÉCHEC DE SYNC : Fenêtre de 30s dépassée. Réinitialisation !");
          executeReset(false);
        }
      } else {
        document.getElementById('clue-box').style.display = 'none';
      }
    });

    // Fonction pour mettre à jour l'indicateur READY d'une station
    function updateReadyIndicator(station, isReady) {
      const readyDiv = document.getElementById(`ready-${station}`);
      if (readyDiv) {
        if (isReady) {
          readyDiv.classList.add('ready');
          readyDiv.innerText = '✅ PRÊT';
        } else {
          readyDiv.classList.remove('ready');
          readyDiv.innerText = '';
        }
      }
    }

    function updateUI(station, isActive) {
      const box = document.getElementById(`box-${station}`);
      const val = document.getElementById(`val-${station}`);

      if (isActive) {
        box.classList.add('active');
        val.classList.remove('off');
        val.classList.add('on');
        val.innerText = "ON";
      } else {
        box.classList.remove('active');
        val.classList.remove('on');
        val.classList.add('off');
        val.innerText = "OFF";
      }
    }
  </script>
</body>
</html>
